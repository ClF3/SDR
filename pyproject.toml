[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdr-websdr"
version = "0.1.0"
description = "Raspberry Pi WebSDR backend, fake AC920 simulator, and shared SDR protocol helpers."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydantic>=2",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "common*",
    "simulator*",
    "rpi*",
    "sdr_backend",
    "fake_ac920",
]

[tool.pytest.ini_options]
testpaths = ["tests", "rpi/backend/tests"]
pythonpath = [".", "rpi/backend", "simulator"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

